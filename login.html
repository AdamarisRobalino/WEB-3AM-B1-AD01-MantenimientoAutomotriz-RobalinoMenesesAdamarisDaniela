
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | AutoService XYZ</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AutoService XYZ</a>
            <a href="index.html" class="btn btn-outline-light">Volver al inicio</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-2">Iniciar sesión</h2>

                    <p class="text-center text-muted mb-4">
                        Ingresa tus datos para continuar
                    </p>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" id="usuario" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" id="contrasena" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Ingresar
                        </button>

                    </form>
                    <aside class="cuentas-demo" aria-label="Credenciales de demostración">
                        <p><strong>Cliente:</strong> cliente / Cliente123</p>
                        <p><strong>Administrador:</strong> admin / Admin123</p>
                    </aside>
                    <div class="text-center mt-3">
                        <p>¿No tienes una cuenta?</p>
                        <a href="registro.html">Registrarme como cliente</a>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Cuenta fija para probar el acceso de cliente.
        try {
            let clientes = JSON.parse(localStorage.getItem("clientes") || "[]");
            if (!Array.isArray(clientes)) clientes = [];
            const demo = clientes.find(cliente =>
                String(cliente.usuario || "").toLowerCase() === "cliente"
            );
            if (!demo) {
                clientes.push({
                    id: Date.now(), nombre: "Cliente de demostración",
                    correo: "cliente.demo@autoservice.test", telefono: "0999999999",
                    usuario: "cliente", contrasena: "Cliente123", rol: "cliente"
                });
                localStorage.setItem("clientes", JSON.stringify(clientes));
            }
        } catch (error) {
            console.error("No se pudo preparar la cuenta de demostración:", error);
        }
        document.getElementById("formLogin").addEventListener("submit", function(evento) {

            evento.preventDefault();

            const usuario = document.getElementById("usuario").value.trim().toLowerCase();
            const contrasena = document.getElementById("contrasena").value;

            // VALIDAR CAMPOS
            if (!usuario || !contrasena) {
                Swal.fire("Atención", "Completa todos los campos.", "warning");
                return;
            }

            // CUENTA ADMINISTRADOR
            if (usuario === "admin" && (contrasena === "Admin123" || contrasena === "Admin1_" || contrasena === "1234")) {

                sessionStorage.setItem("usuarioActivo", "admin");
                sessionStorage.setItem("rolUsuario", "administrador");

                window.location.href = "admin.html";
                return;
            }

            // OBTENER CLIENTES REGISTRADOS
            let clientes = [];

            try {
                clientes = JSON.parse(localStorage.getItem("clientes")) || [];

                if (!Array.isArray(clientes)) {
                    clientes = [];
                }

            } catch (error) {
                Swal.fire("Error", "No se pudieron consultar las cuentas.", "error");
                return;
            }

            // BUSCAR CLIENTE
            const cliente = clientes.find(item => {

                const usuarioGuardado = String(item.usuario || "")
                    .trim()
                    .toLowerCase();

                return usuarioGuardado === usuario &&
                       item.contrasena === contrasena;
            });

            // VALIDAR ACCESO

            if (cliente && cliente.activo === false) {
                Swal.fire("Cuenta deshabilitada", "Esta cuenta no está habilitada para iniciar sesión. Comunícate con el administrador.", "warning");
                return;
            }

            if (cliente) {

                sessionStorage.setItem("usuarioActivo", cliente.usuario);
                sessionStorage.setItem("rolUsuario", "cliente");

                Swal.fire({
                    title: "¡Bienvenido!",
                    text: "Inicio de sesión correcto.",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "formulario.html";
                });

            } else {

                Swal.fire(
                    "Acceso denegado",
                    "Usuario o contraseña incorrectos. Verifica tus datos.",
                    "error"
                );

            }

        });
    </script>

</body>
</html>
