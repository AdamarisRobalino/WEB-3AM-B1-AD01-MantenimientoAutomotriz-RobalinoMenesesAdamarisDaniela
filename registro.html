
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cliente - AutoService XYZ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AutoService XYZ</a>
            <a href="login.html" class="btn btn-outline-light">Iniciar sesión</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Registro de Cliente</h2>

                    <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

                    <form id="formRegistro">

                        <div class="mb-3">
                            <label for="nombreCliente" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreCliente" required>
                        </div>

                        <div class="mb-3">
                            <label for="correoCliente" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoCliente" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefonoCliente" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoCliente"
                                   maxlength="10" pattern="[0-9]{10}" required>
                        </div>

                        <div class="mb-3">
                            <label for="usuarioCliente" class="form-label">Nombre de usuario</label>
                            <input type="text" class="form-control" id="usuarioCliente"
                                   minlength="4" maxlength="20"
                                   pattern="[a-zA-Z0-9_]{4,20}" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenaCliente" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenaCliente"
                                   minlength="8" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmarContrasena" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Registrarme
                        </button>

                    </form>
                    <section id="credencialesCuenta" class="credenciales-cuenta d-none" aria-live="polite">
                        <h3>Registro exitoso</h3>
                        <p>Guarda tus datos para iniciar sesión:</p>
                        <p><strong>Usuario:</strong> <span id="usuarioCreado"></span></p>
                        <p><strong>Contraseña:</strong> <span id="contrasenaCreada"></span></p>
                        <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
                    </section>

                    <p class="text-center mt-3 mb-0">
                        ¿Ya tienes una cuenta?
                        <a href="login.html">Inicia sesión</a>
                    </p>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const formulario = document.getElementById("formRegistro");
            const mensaje = document.getElementById("mensajeRegistro");
            const credenciales = document.getElementById("credencialesCuenta");

            function mostrarMensaje(texto, tipo) {
                mensaje.textContent = texto;
                mensaje.className = "alert alert-" + tipo;
            }

            formulario.addEventListener("submit", function (evento) {
                evento.preventDefault();

                try {
                    const nombre = document.getElementById("nombreCliente").value.trim();
                    const correo = document.getElementById("correoCliente").value.trim().toLowerCase();
                    const telefono = document.getElementById("telefonoCliente").value.trim();
                    const usuario = document.getElementById("usuarioCliente").value.trim();
                    const contrasena = document.getElementById("contrasenaCliente").value;
                    const confirmar = document.getElementById("confirmarContrasena").value;

                    if (!/^[0-9]{10}$/.test(telefono)) {
                        mostrarMensaje("El teléfono debe tener 10 dígitos.", "danger");
                        return;
                    }

                    if (!/^[a-zA-Z0-9_]{4,20}$/.test(usuario)) {
                        mostrarMensaje("El usuario debe tener entre 4 y 20 caracteres. Usa letras, números o guion bajo.", "danger");
                        return;
                    }

                    if (contrasena.length < 8) {
                        mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "danger");
                        return;
                    }

                    if (contrasena !== confirmar) {
                        mostrarMensaje("Las contraseñas no coinciden.", "danger");
                        return;
                    }

                    let clientes = JSON.parse(localStorage.getItem("clientes") || "[]");

                    if (!Array.isArray(clientes)) {
                        clientes = [];
                    }

                    const usuarioExiste = clientes.some(cliente =>
                        cliente.usuario.toLowerCase() === usuario.toLowerCase()
                    );

                    const correoExiste = clientes.some(cliente =>
                        cliente.correo.toLowerCase() === correo
                    );

                    if (usuarioExiste) {
                        mostrarMensaje("Este nombre de usuario ya está registrado.", "warning");
                        return;
                    }

                    if (correoExiste) {
                        mostrarMensaje("Este correo electrónico ya está registrado.", "warning");
                        return;
                    }

                    const nuevoCliente = {
                        id: Date.now(),
                        nombre: nombre,
                        correo: correo,
                        telefono: telefono,
                        usuario: usuario,
                        contrasena: contrasena,
                        rol: "cliente",
                        activo: true
                    };

                    clientes.push(nuevoCliente);

                    localStorage.setItem("clientes", JSON.stringify(clientes));

                    const comprobacion = JSON.parse(localStorage.getItem("clientes") || "[]");

                    if (!comprobacion.some(cliente => cliente.id === nuevoCliente.id)) {
                        throw new Error("No se pudieron guardar los datos.");
                    }
credenciales.classList.remove("d-none");
                    document.getElementById("usuarioCreado").textContent = usuario;
                    document.getElementById("contrasenaCreada").textContent = contrasena;
                    mensaje.classList.add("d-none");
                    formulario.classList.add("d-none");

                } catch (error) {
                    console.error("Error en el registro:", error);
                    mostrarMensaje("Ocurrió un problema al guardar los datos. Revisa la consola del navegador.", "danger");
                }
            });

        });
    </script>

</body>
</html>
